name: release
# Pushing a tag v* (for example v0.1.4) releases MailRules in four steps:
#   1. release: `make check`, then GoReleaser publishes the GitHub Release with the archives
#      and checksums, not yet marked latest, and keeps the Homebrew cask as an artifact.
#   2. image: the multi-arch image from deploy/Dockerfile, pushed with its version tag only.
#   3. verify: verify-release.yml installs every format on its platform and runs it.
#   4. publish: only when all of that passed, the release becomes the latest, the image gets
#      `latest`, and the cask is pushed to TurtleByte-IN/homebrew-tap.
# Until step 4, users installing "the latest" still get the previous release.
on:
  push:
    tags: ["v*"]

# Each job asks for only what it needs.
permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release and upload its assets
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # GoReleaser needs the tags and history for the changelog
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: make check
      # GoReleaser's before hook runs `make web`, which builds the web app and copies it to
      # internal/web/dist/app, so every binary embeds the UI.
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: v2.18.2
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v5
        with:
          name: cask
          path: dist/homebrew/Casks/mailrules.rb
          if-no-files-found: error

  image:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to ghcr.io
    steps:
      - uses: actions/checkout@v7
      # deploy/Dockerfile cross-compiles on the runner's platform, so no QEMU is needed.
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The version without its leading v (as in the release archives). `latest` is added
      # by the publish job once the release is verified.
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/turtlebyte-in/mailrules
          tags: type=semver,pattern={{version}}
          flavor: latest=false
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ steps.meta.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          push: true

  verify:
    needs: [release, image]
    permissions:
      contents: read
    uses: ./.github/workflows/verify-release.yml
    with:
      tag: ${{ github.ref_name }}
      cask-artifact: cask

  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write # mark the release latest
      packages: write # tag the image latest
    steps:
      - name: Mark the release latest
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release edit "$TAG" -R "$GITHUB_REPOSITORY" --latest
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag the image latest
        env:
          TAG: ${{ github.ref_name }}
        run: |
          docker buildx imagetools create -t ghcr.io/turtlebyte-in/mailrules:latest "ghcr.io/turtlebyte-in/mailrules:${TAG#v}"
      - uses: actions/download-artifact@v5
        with:
          name: cask
          path: cask
      - name: Push the cask to the tap
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then echo "HOMEBREW_TAP_TOKEN is not set: the cask is not published"; exit 0; fi
          git clone --depth 1 "https://x-access-token:${TAP_TOKEN}@github.com/TurtleByte-IN/homebrew-tap.git" tap
          mkdir -p tap/Casks
          cp cask/mailrules.rb tap/Casks/mailrules.rb
          cd tap
          git add Casks/mailrules.rb
          if git diff --cached --quiet; then echo "the tap already has this cask"; exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "Brew cask update for mailrules version $TAG"
          git push origin HEAD
