openapi: 3.1.0
info:
  title: MailRules API
  version: 0.1.0
  description: |
    JSON REST API of the MailRules daemon. This file is the contract the web UI's
    TypeScript client is generated from. It grows one area per backend milestone;
    a test fails if the daemon serves an /api path that is not listed here, or the reverse.

    Conventions: JSON bodies; timestamps are unix seconds; lists use cursor pagination
    (`?cursor=&limit=`, max 100). Every request receives a `mailrules_csrf` cookie, and
    every non-GET request must send its value back in the `X-CSRF-Token` header.
    Call `GET /api/auth/me` first: it hands out the cookie and says which screen to show.
servers:
  - url: http://127.0.0.1:8080
paths:
  /api/auth/setup:
    post:
      operationId: authSetup
      summary: Create the admin account (first run only) and sign in
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Credentials' }
      responses:
        '201':
          description: Account created; session cookie set
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '400': { $ref: '#/components/responses/Error' } # invalid_input (path: email | password), invalid_json
        '403': { $ref: '#/components/responses/Error' } # csrf_failed
        '409': { $ref: '#/components/responses/Error' } # already_set_up
  /api/auth/login:
    post:
      operationId: authLogin
      summary: Sign in; replaces any session the browser already holds
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Credentials' }
      responses:
        '200':
          description: Signed in; session cookie set
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '400': { $ref: '#/components/responses/Error' } # invalid_json
        '401': { $ref: '#/components/responses/Error' } # invalid_credentials
        '403': { $ref: '#/components/responses/Error' } # csrf_failed
        '429':
          description: rate_limited; five failed sign-ins per minute per IP
          headers:
            Retry-After:
              schema: { type: integer }
              description: Seconds until sign-in is allowed again
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }
  /api/auth/logout:
    post:
      operationId: authLogout
      summary: End the session; safe to call when not signed in
      responses:
        '204': { description: Signed out }
        '403': { $ref: '#/components/responses/Error' } # csrf_failed
  /api/auth/me:
    get:
      operationId: authMe
      summary: Who is signed in
      responses:
        '200':
          description: Signed in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '401': { $ref: '#/components/responses/Error' } # setup_required (show first-run setup) | unauthenticated (show sign-in)
components:
  schemas:
    Credentials:
      type: object
      required: [email, password]
      additionalProperties: false
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 12, description: Minimum applies to setup only }
    User:
      type: object
      required: [id, email]
      properties:
        id: { type: integer, format: int64 }
        email: { type: string }
    Session:
      type: object
      required: [user]
      properties:
        user: { $ref: '#/components/schemas/User' }
    ErrorBody:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: Stable machine-readable code, e.g. invalid_input, csrf_failed, unauthenticated
            message: { type: string, description: Sentence safe to show the user }
            path: { type: string, description: Field the error is about, when there is one }
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorBody' }
