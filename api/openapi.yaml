openapi: 3.1.0
info:
  title: MailRules API
  version: 0.18.0
  description: |
    JSON REST API of the MailRules daemon, plus one Server-Sent Events stream. This file is
    the contract the web UI's TypeScript client is generated from. A test fails if the daemon
    serves an /api path that is not listed here, or the reverse.

    **Conventions**

    - JSON bodies. Unknown fields in a request are rejected with 400 `invalid_json`.
    - Timestamps are unix seconds. Ids are integers. An absent time or reference is `null`.
    - Errors are `{"error": {"code", "message", "path"}}`. `code` is stable and machine-readable.
      `message` is a sentence for a person, safe to show as it is: it starts with a capital,
      ends with a full stop and never contains a field path. `path` alone says where the
      problem is, when there is a place (for a rule: `conditions.all[0].op`; in a batch:
      `rules[1].conditions.all[0].op`).
    - Lists that can grow use cursor pagination: `?cursor=&limit=` (limit 1 to 100, default 50).
      The response carries `next_cursor`; pass it back as `cursor`, and `null` means the end.
      A cursor is opaque, with one exception a client may rely on: for `/api/senders` it is
      an offset into the sorted list.
    - A request field that may be left out says in its description what is used then. The
      schema carries no `default` for request-body fields, so generated clients type them
      as optional.
    - What MailRules did stays undoable for 30 days. An action, or a batch, older than that
      is refused by every undo endpoint with 409 `too_old`, and a feed row's `undoable` is
      false once nothing on it is younger.
    - Every route except the four under `/api/auth`, `/healthz`, `/readyz` and `/metrics` needs
      the `mailrules_session` cookie, and answers 401 without one: `setup_required` before the
      admin account exists, `unauthenticated` after.
    - Every response hands out a `mailrules_csrf` cookie, and every non-GET request must send
      its value back in the `X-CSRF-Token` header, or it is answered 403 `csrf_failed`.
      Call `GET /api/auth/me` first: it hands out the cookie and says which screen to show.
    - The only message text the API ever returns is `snippet`, at most 200 characters.
      Passwords and provider keys are write-only: no response contains one.
servers:
  - url: http://127.0.0.1:8080
security:
  - session: []
tags:
  - { name: Auth }
  - { name: Accounts }
  - { name: Rules }
  - { name: Senders }
  - { name: Activity }
  - { name: Review }
  - { name: Fixes }
  - { name: Cleanup }
  - { name: Templates }
  - { name: Stats }
  - { name: Settings }
  - { name: Live }
  - { name: Ops }
paths:
  /api/auth/setup:
    post:
      tags: [Auth]
      security: []
      operationId: authSetup
      summary: Create the admin account (first run only) and sign in
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Credentials' }
      responses:
        '201':
          description: Account created; session cookie set
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '400': { $ref: '#/components/responses/Invalid' } # invalid_input (path: email | password), invalid_json
        '403': { $ref: '#/components/responses/CsrfFailed' }
        '409': { $ref: '#/components/responses/Error' } # already_set_up
  /api/auth/login:
    post:
      tags: [Auth]
      security: []
      operationId: authLogin
      summary: Sign in; replaces any session the browser already holds
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Credentials' }
      responses:
        '200':
          description: Signed in; session cookie set
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '400': { $ref: '#/components/responses/Invalid' } # invalid_json
        '401': { $ref: '#/components/responses/Error' } # invalid_credentials
        '403': { $ref: '#/components/responses/CsrfFailed' }
        '429':
          description: rate_limited; five failed sign-ins per minute per IP
          headers:
            Retry-After:
              schema: { type: integer }
              description: Seconds until sign-in is allowed again
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }
  /api/auth/logout:
    post:
      tags: [Auth]
      security: []
      operationId: authLogout
      summary: End the session; safe to call when not signed in
      responses:
        '204': { description: Signed out }
        '403': { $ref: '#/components/responses/CsrfFailed' }
  /api/auth/me:
    get:
      tags: [Auth]
      security: []
      operationId: authMe
      summary: Who is signed in
      responses:
        '200':
          description: Signed in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '401': { $ref: '#/components/responses/Error' } # setup_required (show first-run setup) | unauthenticated (show sign-in)
  /api/presets:
    get:
      tags: [Accounts]
      operationId: listPresets
      summary: Provider presets for the connect wizard
      responses:
        '200':
          description: Every preset, generic last
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Preset' } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
  /api/accounts/test:
    post:
      tags: [Accounts]
      operationId: testAccount
      summary: Log in with credentials that are not stored, and list the folders
      description: Changes nothing, in the database or the mailbox. The password is used for this login only.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccountInput' }
      responses:
        '200':
          description: The server accepted the login
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountTestResult' }
        '400': { $ref: '#/components/responses/Invalid' } # invalid_input (path: preset | username | password | host | port | tls_mode), invalid_json
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/CsrfFailed' }
        '422': { $ref: '#/components/responses/ConnectionFailed' }
  /api/accounts:
    get:
      tags: [Accounts]
      operationId: listAccounts
      summary: Every connected mailbox, oldest first
      responses:
        '200':
          description: Accounts
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Account' } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
    post:
      tags: [Accounts]
      operationId: createAccount
      summary: Connect a mailbox and start watching it
      description: |
        The login is checked against the server before anything is stored. Only mail that
        arrives from now on is sorted; existing mail is Cleanup's job. The new account's
        `status` is `new` until its supervisor reports over `account.status`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccountInput' }
      responses:
        '201':
          description: Stored and being watched
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountEnvelope' }
        '400': { $ref: '#/components/responses/Invalid' } # as for /api/accounts/test
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/CsrfFailed' }
        '409': { $ref: '#/components/responses/Conflict' } # account_exists (path: username)
        '422': { $ref: '#/components/responses/ConnectionFailed' }
  /api/accounts/{id}:
    parameters:
      - { $ref: '#/components/parameters/Id' }
    get:
      tags: [Accounts]
      operationId: getAccount
      summary: One account
      responses:
        '200':
          description: The account
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountEnvelope' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Accounts]
      operationId: updateAccount
      summary: Rename, change the watched folder or the app password, pause or resume
      description: Anything but the label restarts the account's connection, so the change is in force when the response arrives.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccountPatch' }
      responses:
        '200':
          description: The account as it is now
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountEnvelope' }
        '400': { $ref: '#/components/responses/Invalid' } # invalid_input (path: label | watch_folder | password | paused), invalid_json
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/CsrfFailed' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Accounts]
      operationId: deleteAccount
      summary: Disconnect a mailbox and wipe everything stored about it
      description: Stops watching, then deletes the account with its password, folders, contacts, messages, decisions, actions and the rules scoped to it. Nothing in the mailbox is touched.
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/CsrfFailed' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/accounts/{id}/reconnect:
    parameters:
      - { $ref: '#/components/parameters/Id' }
    post:
      tags: [Accounts]
      operationId: reconnectAccount
      summary: Drop the connection and connect again
      description: Also how an account that stopped on `auth_failed` or `error` is started again. The outcome arrives over `account.status`.
      responses:
        '200':
          description: Reconnecting; the body is the account as stored at this moment
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountEnvelope' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/CsrfFailed' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' } # account_paused
  /api/accounts/{id}/test:
    parameters:
      - { $ref: '#/components/parameters/Id' }
    post:
      tags: [Accounts]
      operationId: testStoredAccount
      summary: Check a connected account's stored login, without disturbing it
      description: |
        Logs in with the stored password on a connection of its own, lists the folders and
        closes it again. The account's watcher is not restarted and its `status` does not
        change: this only answers "would it connect right now?". Use
        `/api/accounts/{id}/reconnect` to actually restart it. Works for a paused account too.
      responses:
        '200':
          description: The server accepted the stored login
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountTestResult' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/CsrfFailed' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ConnectionFailed' }
  /api/accounts/{id}/folders:
    parameters:
      - { $ref: '#/components/parameters/Id' }
    get:
      tags: [Accounts]
      operationId: listAccountFolders
      summary: The account's folders, as last discovered on the server
      responses:
        '200':
          description: Folders by name
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Folder' } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/rules:
    get:
      tags: [Rules]
      operationId: listRules
      summary: Every rule in priority order, with this week's hit count and last match
      responses:
        '200':
          description: Rules, disabled ones included
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RuleList' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
  /api/rules/compose:
    post:
      tags: [Rules]
      operationId: composeRules
      summary: Turn free text into validated draft rules
      description: |
        Nothing is saved. Each draft comes back validated: what is wrong with one is in its
        `errors`, and the request still answers 200. The drafts without errors are then
        tested together, in the order given, on the last 200 messages of the account's
        watched folder (model calls recorded with purpose `test`; the composer's own call
        with purpose `compose`), and each gets `match_count` and up to 5 `samples`. With no
        account connected nothing is tested. Needs a generative model: 409
        `no_composer_model` until an Anthropic key is set in Settings.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ComposeRequest' }
      responses:
        '200':
          description: Drafts to review
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ComposeResult' }
        '400': { $ref: '#/components/responses/Invalid' } # invalid_input (path: text | account_id), invalid_json
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/CsrfFailed' }
        '409': { $ref: '#/components/responses/Conflict' } # no_composer_model
        '502': { $ref: '#/components/responses/Upstream' } # model_error
  /api/rules/batch:
    post:
      tags: [Rules]
      operationId: createRules
      summary: Save rules, in one transaction
      description: |
        How every rule is created besides import: approved composer drafts, a rule built by
        hand in the condition builder, a template. It needs no model. Every rule is
        validated before anything is done, so one bad rule saves none. A rule is known by
        its name: two rules of the batch with the same name, or one named like a saved
        rule, are refused (400 `rule_invalid`, path `rules[1].name`). `new_folders` are
        then created on the rule's account (every connected account for a rule with
        `account_id` null), and the rules inserted at the end or at `position`. Folders are
        not created while dry-run is on or the account is offline; the first live move
        creates a missing folder.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RuleBatchRequest' }
      responses:
        '201':
          description: The saved rules
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Rule' } }
        '400': { $ref: '#/components/responses/Invalid' } # rule_invalid (path: rules[0].conditions.all[0].op | rules[0].model | rules[0].new_folders[0] | rules[1].name for a name used twice or already saved), invalid_input (path: rules | rules[0] for a field of the wrong type or an unknown one | rules[0].account_id), invalid_json
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/CsrfFailed' }
        '502': { $ref: '#/components/responses/Upstream' } # mailbox_error: a folder could not be created; nothing was saved
  /api/rules/reorder:
    post:
      tags: [Rules]
      operationId: reorderRules
      summary: Set the priority order of all rules
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              additionalProperties: false
              properties:
                ids:
                  type: array
                  items: { type: integer, format: int64 }
                  description: Every rule's id exactly once; the first runs first
      responses:
        '200':
          description: The rules in their new order
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RuleList' }
        '400': { $ref: '#/components/responses/Invalid' } # invalid_input (path: ids), invalid_json
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/CsrfFailed' }
  /api/rules/test:
    post:
      tags: [Rules]
      operationId: testRules
      summary: Run saved or draft rules over recent mail without acting
      description: |
        Never touches the mailbox: mail is read with BODY.PEEK and stays unread and where it
        is. Decides exactly as live processing does (sender rules, conditions, the decision
        model, each rule's own `model`). Model usage is recorded with purpose `test`. A
        request that names rules (`rule_ids`, `rules`, or both) tests exactly those and
        nothing else: no other saved rule and no sender rule takes part. Only a request that
        names neither tests the saved rule set as it is. A decision model is needed only when
        at least one of the tested rules has an intent: 409 `no_composer_model` when none is
        set; condition-only rules are tested without one.

        **Progress.** A client that sends `Accept: text/event-stream` (the web UI does) gets
        a `text/event-stream`, whatever the `limit`: a `progress` event carrying
        `TestProgress` as soon as the mail is listed (`done` 0 of `total`), then another
        every `total / 100` emails (every email up to 199 of them) and at `total` of
        `total`, then one `done` event carrying `TestResult`, or, if the run fails midway,
        one `error` event carrying `ErrorBody` (code `test_failed`). Any other client gets
        the `TestResult` as one JSON body. A run that fails before the mail is listed (no
        such folder, no model, account offline, invalid input) is answered as plain JSON
        with its usual status, whatever the client accepts. A client that drops the request
        ends the run; the daemon logs that as cancelled, not as an error.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TestRequest' }
      responses:
        '200':
          description: What each email would get
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TestResult' }
            text/event-stream:
              schema: { type: string, description: '`progress` events (TestProgress), then `done` (TestResult) or `error` (ErrorBody)' }
        '400': { $ref: '#/components/responses/Invalid' } # invalid_input (path: rule_ids | account_id | folder | limit | rules[0]), rule_invalid (path: rules[0]...), invalid_json
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/CsrfFailed' }
        '409': { $ref: '#/components/responses/Conflict' } # account_offline, no_composer_model
        '502': { $ref: '#/components/responses/Upstream' } # model_error, mailbox_error
  /api/rules/export:
    get:
      tags: [Rules]
      operationId: exportRules
      summary: Download every rule as a YAML file
      description: The PRD rule-file shape (`id` is the rule's name, `when` the intent, `match` the conditions, `unless` the exceptions). The database stays the source of truth.
      responses:
        '200':
          description: The rules file
          content:
            application/yaml:
              schema: { type: string }
        '401': { $ref: '#/components/responses/Unauthenticated' }
  /api/rules/import:
    post:
      tags: [Rules]
      operationId: importRules
      summary: Upload a rules YAML file
      description: |
        The request body is the file itself (at most 1 MB). Nothing is stored unless every
        rule in it is valid. A rule whose name (`id` in the file) is already in use replaces
        that rule's wording and keeps its place, account and id; the others are added after
        the existing rules, in file order. Rules the file does not name are left alone.
      requestBody:
        required: true
        content:
          application/yaml:
            schema: { type: string }
      responses:
        '200':
          description: All rules after the import, with how many were added and updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImportResult' }
        '400': { $ref: '#/components/responses/Invalid' } # rule_invalid: message has one line per rule with a problem, each naming its rule ('Rule 3 ("Scams"): Unknown operator "like".'); path is where the first problem is inside its rule (conditions.any[0].op)
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/CsrfFailed' }
        '413': { $ref: '#/components/responses/TooLarge' }
  /api/rules/{id}:
    parameters:
      - { $ref: '#/components/parameters/Id' }
    get:
      tags: [Rules]
      operationId: getRule
      summary: One rule
      responses:
        '200':
          description: The rule
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RuleEnvelope' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Rules]
      operationId: updateRule
      summary: Edit a rule; fields left out stay as they are
      description: The result is validated as a whole, by the same check a batch save and an import run (`model` included), and the rule's `version` goes up by one. Priority is changed with `/api/rules/reorder`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RulePatch' }
      responses:
        '200':
          description: The rule as saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RuleEnvelope' }
        '400': { $ref: '#/components/responses/Invalid' } # rule_invalid (path e.g. conditions.all[0].op, or model), invalid_input (path: a field of the wrong type, or account_id), invalid_json
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/CsrfFailed' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Rules]
      operationId: deleteRule
      summary: Delete a rule
      description: Its past decisions stay in the activity feed under the name it had (`rule_id` becomes null there). Sender rules that route to it go with it.
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/CsrfFailed' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/rules/{id}/compose:
    parameters:
      - { $ref: '#/components/parameters/Id' }
    post:
      tags: [Rules]
      operationId: recomposeRule
      summary: Re-optimize one rule from its original wording plus new text
      description: Returns a single draft to replace the rule, validated and tested like a composed one. Nothing is saved; save it with PATCH.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              additionalProperties: false
              properties:
                text: { type: string, maxLength: 4000 }
      responses:
        '200':
          description: The replacement draft
          content:
            application/json:
              schema:
                type: object
                required: [rule]
                properties:
                  rule: { $ref: '#/components/schemas/RuleDraft' }
        '400': { $ref: '#/components/responses/Invalid' } # invalid_input (path: text), invalid_json
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/CsrfFailed' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' } # no_composer_model
        '502': { $ref: '#/components/responses/Upstream' } # model_error
  /api/rules/{id}/undo:
    parameters:
      - { $ref: '#/components/parameters/Id' }
      - { $ref: '#/components/parameters/Since' }
    post:
      tags: [Fixes]
      operationId: undoRuleSince
      summary: Undo everything this rule did since a time
      description: Recorded as one batch of kind `undo`. An action that cannot be undone does not stop the rest. Actions older than 30 days are not undoable and are left out, however far back `since` reaches.
      responses:
        '200':
          description: The undo batch and its counts
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UndoResult' }
        '400': { $ref: '#/components/responses/Invalid' } # invalid_input (path: since)
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/CsrfFailed' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/senders:
    get:
      tags: [Senders]
      operationId: listSenders
      summary: Senders by volume, with how each is routed
      description: |
        Every address mail was seen from in the last 30 days, every address that has a sender
        rule even if it has been quiet, and every domain that has a sender rule (counted over
        its addresses). `source=learned` lists the rules MailRules learned by itself,
        `source=user` the ones the user set. The cursor is an offset into the sorted list (a
        plain number: `50` is the second page of 50), not an opaque token, so the list can
        shift under it when mail arrives between two pages.
      parameters:
        - { name: sort, in: query, schema: { type: string, enum: [volume, recent], default: volume } }
        - { name: q, in: query, schema: { type: string }, description: Matches the address or display name }
        - { name: source, in: query, schema: { type: string, enum: [user, learned] }, description: Only senders with a sender rule from this source }
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: One page of senders
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Sender' } }
                  next_cursor: { type: [string, 'null'] }
        '400': { $ref: '#/components/responses/Invalid' } # invalid_input (path: sort | source | cursor | limit)
        '401': { $ref: '#/components/responses/Unauthenticated' }
  /api/senders/{type}/{value}:
    parameters:
      - { name: type, in: path, required: true, schema: { type: string, enum: [address, domain] } }
      - { name: value, in: path, required: true, schema: { type: string }, description: The address or domain, lower-case, URL-encoded }
    put:
      tags: [Senders]
      operationId: putSender
      summary: Set how a sender is routed
      description: Stores a sender rule of source `user`, replacing whatever the sender had, a learned rule included. Mail from the sender is then settled without a model; `hits` counts it.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SenderPut' }
      responses:
        '200':
          description: The sender with its rule
          content:
            application/json:
              schema:
                type: object
                required: [sender]
                properties:
                  sender: { $ref: '#/components/schemas/Sender' }
        '400': { $ref: '#/components/responses/Invalid' } # invalid_input (path: type | value | verdict | rule_id), invalid_json
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/CsrfFailed' }
    delete:
      tags: [Senders]
      operationId: deleteSender
      summary: Remove a sender rule, user-made or learned
      responses:
        '204': { description: Removed, or there was none }
        '400': { $ref: '#/components/responses/Invalid' } # invalid_input (path: type | value)
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/CsrfFailed' }
  /api/activity:
    get:
      tags: [Activity]
      operationId: listActivity
      summary: The feed, newest first
      description: Every email MailRules has seen, with its latest decision and all actions taken on it.
      parameters:
        - { name: account, in: query, schema: { type: integer, format: int64 }, description: Only this account }
        - { name: rule, in: query, schema: { type: integer, format: int64 }, description: Only mail whose latest decision names this rule }
        - { name: stage, in: query, schema: { $ref: '#/components/schemas/Stage' }, description: Only mail whose latest decision was made at this stage }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/MessageState' }, description: Only mail in this state }
        - { name: action, in: query, schema: { $ref: '#/components/schemas/ActionKind' }, description: Only mail with an action of this kind }
        - { name: outcome, in: query, schema: { type: string, enum: [sorted, trashed, inbox, review] }, description: 'Only mail that ended up there: the four groups of `StatsSummary.went`, counted the same way, so a group''s number and the list behind it agree' }
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: One page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActivityPage' }
        '400': { $ref: '#/components/responses/Invalid' } # invalid_input (path: account | rule | stage | status | action | outcome | cursor | limit)
        '401': { $ref: '#/components/responses/Unauthenticated' }
  /api/messages/{id}:
    parameters:
      - { $ref: '#/components/parameters/Id' }
    get:
      tags: [Activity]
      operationId: getMessage
      summary: One email with its decision trace ("Why this happened")
      responses:
        '200':
          description: The feed row plus header details and the trace
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message: { $ref: '#/components/schemas/MessageDetail' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/messages/{id}/correct:
    parameters:
      - { $ref: '#/components/parameters/Id' }
    post:
      tags: [Fixes]
      operationId: correctMessage
      summary: Say an email belongs to another rule, or to none
      description: |
        Undoes what was done to the email (newest first), applies the right rule's actions
        (`rule_id` null keeps it in the inbox), records the correction as a few-shot example
        and forgets any learned sender rule for that sender. The new actions are one batch of
        kind `correction`. In dry-run the earlier real actions are still undone and the new
        ones are recorded as `dry_run`. With `always_for` a sender rule is stored too, for
        the sender's address or its whole domain; a domain rule is refused with 422
        `domain_too_broad` for a well-known free-mail domain (gmail.com, googlemail.com,
        outlook.com, hotmail.com, live.com, yahoo.com, icloud.com, me.com, mac.com, proton.me,
        protonmail.com, aol.com, gmx.com, zoho.com, fastmail.com), before anything is done.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FixRequest' }
      responses:
        '200':
          description: The email as it is now
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FixResult' }
        '400': { $ref: '#/components/responses/Invalid' } # invalid_input (path: rule_id | always_for), invalid_json
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/CsrfFailed' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' } # message_gone, account_offline
        '422': { $ref: '#/components/responses/Unprocessable' } # no_special_folder, domain_too_broad (path: always_for)
        '502': { $ref: '#/components/responses/Upstream' } # mailbox_error
  /api/messages/{id}/undo:
    parameters:
      - { $ref: '#/components/parameters/Id' }
    post:
      tags: [Fixes]
      operationId: undoMessage
      summary: Undo everything still in effect on one email
      description: |
        Undoes every action on the email that is still in effect, newest first, in one
        call, recorded as one batch of kind `undo`. An action that cannot be undone does not
        stop the others: `failed` counts them, and `item` shows each action as it is now
        (`undoable` stays true while one is still in effect). The request is refused only
        when not one action could be undone, with the reason of the first: 409
        `message_gone` when the email was moved or deleted outside MailRules, `too_old` when
        what was done is older than 30 days. With nothing
        in effect (already undone, only recorded in dry-run, or no action at all) it does
        nothing and answers 200 with zero counts. The Needs review tag is left alone. Each
        undone action is also sent as `action.undone`. Undo ignores dry-run.
      responses:
        '200':
          description: The email as it is now, and how the undo went
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageUndoResult' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/CsrfFailed' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' } # message_gone, account_offline, too_old: nothing could be undone
        '502': { $ref: '#/components/responses/Upstream' } # mailbox_error: nothing could be undone
  /api/review:
    get:
      tags: [Review]
      operationId: listReview
      summary: Mail waiting in Needs review, newest first
      description: Each row's `decision` names the rule the model would have picked (`rule_id` null when it had none) and why it was unsure.
      parameters:
        - { name: account, in: query, schema: { type: integer, format: int64 } }
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: One page, and the size of the whole queue
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReviewPage' }
        '400': { $ref: '#/components/responses/Invalid' } # invalid_input (path: account | cursor | limit)
        '401': { $ref: '#/components/responses/Unauthenticated' }
  /api/review/{message_id}/resolve:
    parameters:
      - { name: message_id, in: path, required: true, schema: { type: integer, format: int64 } }
    post:
      tags: [Review]
      operationId: resolveReview
      summary: Approve the suggested rule, choose another, or keep the email in the inbox
      description: The same as `/api/messages/{id}/correct`, for an email that is in Needs review.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FixRequest' }
      responses:
        '200':
          description: The email as it is now
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FixResult' }
        '400': { $ref: '#/components/responses/Invalid' } # invalid_input (path: rule_id | always_for), invalid_json
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/CsrfFailed' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' } # not_in_review, message_gone, account_offline
        '422': { $ref: '#/components/responses/Unprocessable' } # no_special_folder, domain_too_broad (path: always_for)
        '502': { $ref: '#/components/responses/Upstream' } # mailbox_error
  /api/actions/undo:
    parameters:
      - { $ref: '#/components/parameters/Since' }
    post:
      tags: [Fixes]
      operationId: undoSince
      summary: Undo everything done since a time ("Undo the last hour")
      description: Recorded as one batch of kind `undo`. An action that cannot be undone does not stop the rest. The Needs review tag is not an undoable action and is left alone. Actions older than 30 days are not undoable and are left out, however far back `since` reaches.
      responses:
        '200':
          description: The undo batch and its counts
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UndoResult' }
        '400': { $ref: '#/components/responses/Invalid' } # invalid_input (path: since)
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/CsrfFailed' }
  /api/actions/{id}/undo:
    parameters:
      - { $ref: '#/components/parameters/Id' }
    post:
      tags: [Fixes]
      operationId: undoAction
      summary: Undo one action
      description: To undo everything done to one email, use `POST /api/messages/{id}/undo`, which does it in one call. A move goes back to the folder it came from; a flag goes back to what it was. Undoing an action that is already undone, or that never changed the mailbox (`dry_run`, `failed`), does nothing and answers 200. Undo ignores dry-run.
      responses:
        '200':
          description: The action as it is now
          content:
            application/json:
              schema:
                type: object
                required: [action]
                properties:
                  action: { $ref: '#/components/schemas/MessageAction' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/CsrfFailed' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' } # message_gone (the action stays done), account_offline, too_old (done more than 30 days ago)
        '502': { $ref: '#/components/responses/Upstream' } # mailbox_error
  /api/batches:
    get:
      tags: [Cleanup]
      operationId: listBatches
      summary: Past batches, newest first
      description: The Cleanup screen lists `kind=cleanup` as its "batches you can undo"; undo one with `POST /api/batches/{id}/undo`. A batch can be undone for 30 days from its `created_at`.
      parameters:
        - { name: kind, in: query, schema: { type: string, enum: [live, cleanup, review, correction, undo] }, description: Only batches of this kind }
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: One page
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Batch' } }
                  next_cursor: { type: [string, 'null'] }
        '400': { $ref: '#/components/responses/Invalid' } # invalid_input (path: kind | cursor | limit)
        '401': { $ref: '#/components/responses/Unauthenticated' }
  /api/batches/{id}:
    parameters:
      - { $ref: '#/components/parameters/Id' }
    get:
      tags: [Cleanup]
      operationId: getBatch
      summary: One batch with its progress and action counts
      responses:
        '200':
          description: The batch
          content:
            application/json:
              schema:
                type: object
                required: [batch]
                properties:
                  batch: { $ref: '#/components/schemas/Batch' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/batches/{id}/undo:
    parameters:
      - { $ref: '#/components/parameters/Id' }
    post:
      tags: [Fixes]
      operationId: undoBatch
      summary: Undo every action of a batch, newest first
      description: |
        An action that cannot be undone does not stop the rest; `failed` counts them and the
        batch becomes `undone` only when every action was. A batch stays undoable for 30
        days from when it was created; after that the answer is 409 `too_old`. Undoing a
        batch that never changed a mailbox (all its actions were recorded as `dry_run`) is a
        no-op: it answers 200 with `undone` 0 and `failed` 0, and the batch stays as it is.
      responses:
        '200':
          description: The batch and how the undo went
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UndoResult' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/CsrfFailed' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' } # too_old: the batch is older than 30 days
  /api/cleanup/check:
    post:
      tags: [Cleanup]
      operationId: startCleanupCheck
      summary: Check the selected mail for real, keeping the result to sort from
      description: |
        Runs every selected email through the real flow — sender rules, then conditions,
        then the decision model for rules with an intent, exactly as live processing decides
        — moving nothing and recording nothing in Activity, but really asking the model and
        paying for it: the calls are booked on the usage ledger under the `cleanup` purpose,
        so Usage can tell them from live sorting. It answers at once with the check,
        `running`; its rows, progress and real cost arrive as `check.progress` events and
        through `GET /api/cleanup/check`. The check runs in the background and keeps going if
        this request is dropped. There is one check per account: starting a new one replaces
        (and cancels) the previous. The result is held in the daemon's memory until Sort uses
        it or it is discarded, and is lost on a daemon restart.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CleanupCheckRequest' }
      responses:
        '202':
          description: Started
          content:
            application/json:
              schema:
                type: object
                required: [check]
                properties:
                  check: { $ref: '#/components/schemas/CleanupCheck' }
        '400': { $ref: '#/components/responses/Invalid' } # invalid_input (path: account_id | folder | since | limit), invalid_json
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/CsrfFailed' }
        '409': { $ref: '#/components/responses/Conflict' } # account_offline
        '502': { $ref: '#/components/responses/Upstream' } # mailbox_error
    get:
      tags: [Cleanup]
      operationId: getCleanupCheck
      summary: The account's current check, or none
      description: |
        Returns the account's current check so a page reload, or leaving and coming back,
        shows the same result: `running` with `done`/`total`, `ready` with its rows, `failed`
        with a message, or `stale` when the rules changed since it ran. `check` is null when
        there is no check. A `ready` check whose rules have changed since is reported `stale`.
      parameters:
        - { name: account_id, in: query, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200':
          description: The current check, or null
          content:
            application/json:
              schema:
                type: object
                required: [check]
                properties:
                  check: { oneOf: [{ $ref: '#/components/schemas/CleanupCheck' }, { type: 'null' }] }
        '400': { $ref: '#/components/responses/Invalid' } # invalid_input (path: account_id)
        '401': { $ref: '#/components/responses/Unauthenticated' }
    delete:
      tags: [Cleanup]
      operationId: discardCleanupCheck
      summary: Discard the account's current check
      parameters:
        - { name: account_id, in: query, required: true, schema: { type: integer, format: int64 } }
      responses:
        '204': { description: Discarded (or there was none) }
        '400': { $ref: '#/components/responses/Invalid' } # invalid_input (path: account_id)
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/CsrfFailed' }
  /api/cleanup/check/selection:
    put:
      tags: [Cleanup]
      operationId: saveCleanupSelection
      summary: Save which rows of the current check are unticked
      description: |
        Keeps the user's ticks with the check, in the daemon's memory, so a page reload or a
        return to the screen shows the same table: `exclude` lists the `index` of every
        selectable row that is not ticked, and replaces any earlier list. The default, and the
        state of a new check, is an empty list: every selectable row is ticked. The selection
        is deleted with the check: when Sort uses it, when it is discarded, and when a new check
        of the mailbox replaces it. It only restores the screen: Sort takes its own `exclude`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CleanupSelectionRequest' }
      responses:
        '204': { description: Saved }
        '400': { $ref: '#/components/responses/Invalid' } # invalid_input (path: account_id | check_id | exclude: a row that cannot be ticked or does not exist), invalid_json
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/CsrfFailed' }
        '409': { $ref: '#/components/responses/Conflict' } # preview_stale (the check is gone, replaced, or the rules changed), check_not_ready
  /api/cleanup/run:
    post:
      tags: [Cleanup]
      operationId: runCleanup
      summary: Sort a finished check's kept rows, as one undoable batch
      description: |
        Applies the answers a check already settled for its selectable rows, minus the ones
        the user unticked (`exclude`, row indices). It makes no model calls: the decisions
        are replayed, not asked again. Answers at once with the batch (kind `cleanup`, status
        `running`, `total` the rows being sorted). The run goes on in the background, oldest
        email first, through the same pipeline and executor as new mail: about a hundred
        `batch.progress` events carry `done`, `total`, `skipped` and the counts as they grow,
        and `GET /api/batches/{id}` says the same. An email no longer where the check found
        it is passed over and counted in `skipped`. Honours dry-run: the actions are then
        recorded as `dry_run` and nothing moves. Undo the whole run with
        `POST /api/batches/{id}/undo`. The check is deleted once it has been used. One run per
        account at a time.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CleanupRunRequest' }
      responses:
        '202':
          description: Started
          content:
            application/json:
              schema:
                type: object
                required: [batch]
                properties:
                  batch: { $ref: '#/components/schemas/Batch' }
        '400': { $ref: '#/components/responses/Invalid' } # invalid_input (path: account_id | check_id), invalid_json
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/CsrfFailed' }
        '409': { $ref: '#/components/responses/Conflict' } # preview_stale (the check is gone or the rules changed), check_not_ready, account_offline, cleanup_running
        '502': { $ref: '#/components/responses/Upstream' } # mailbox_error
  /api/templates:
    get:
      tags: [Templates]
      operationId: listTemplates
      summary: The rule template gallery
      description: Each template carries a ready rule; add it by sending that rule to `/api/rules/batch`.
      responses:
        '200':
          description: Templates
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Template' } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
  /api/stats/summary:
    get:
      tags: [Stats]
      operationId: statsSummary
      summary: Counts, cost and account health for the Overview screen and the Activity tiles
      description: |
        A range starts on a UTC day boundary, today included: `day` is today, `week` the
        last 7 days, `month` the last 30. An email is counted once, by its latest decision.
      parameters:
        - { name: range, in: query, schema: { type: string, enum: [day, week, month], default: day } }
      responses:
        '200':
          description: The summary
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StatsSummary' }
        '400': { $ref: '#/components/responses/Invalid' } # invalid_input (path: range)
        '401': { $ref: '#/components/responses/Unauthenticated' }
  /api/stats/usage:
    get:
      tags: [Stats]
      operationId: statsUsage
      summary: Model calls and cost by day, rule and model for the Usage screen
      description: |
        `days`, `by_model`, `calls` and `cost_usd` come from the cost ledger, which records
        every model call under its purpose (decide, escalate, compose, test, cleanup). `by_rule` comes
        from the decisions, which know which rule a call was for, so it leaves out composing
        and testing and its costs add up to less than `cost_usd`.
      parameters:
        - { name: range, in: query, schema: { type: string, enum: [month], default: month } }
      responses:
        '200':
          description: Usage
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StatsUsage' }
        '400': { $ref: '#/components/responses/Invalid' } # invalid_input (path: range)
        '401': { $ref: '#/components/responses/Unauthenticated' }
  /api/settings:
    get:
      tags: [Settings]
      operationId: getSettings
      summary: The settings in force
      description: Stored settings lie over the environment variables, which are the defaults. Provider keys are never returned; `keys` only says where each comes from. `warnings` lists what the chosen decider still lacks.
      responses:
        '200':
          description: Settings
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Settings' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
    patch:
      tags: [Settings]
      operationId: updateSettings
      summary: Change settings; fields left out stay as they are
      description: |
        The result is validated as a whole and stored in one transaction. Everything takes
        effect without a restart, from the next email on. Provider keys are stored encrypted
        under the master key.

        **One rule for every setting.** A field left out stays as it is. `null` forgets the
        stored value, which puts the environment's default back in force. An empty string
        is a value like any other and is stored: `fallback_model` "" turns the fallback off,
        `decider_model` "" means the provider's default model, `openai_base_url` "" means
        api.openai.com and `ollama_url` "" means no server. Where an empty value cannot
        work it is refused with 400: `composer_model`, and `decider_model` while the decider
        is `openai` or `ollama`, which have no default model. The one exception is a
        provider key, which cannot be "set to nothing": in `keys`, both "" and `null` remove
        the stored key.

        **A decider that cannot work yet is not refused.** The first-run wizard saves in
        steps (the decider first, its key or URL after), so a change that leaves the chosen
        decider without its key or URL answers 200, and the response, like `GET`, lists
        what is missing in `warnings`. Until it is set, rules that need a model are passed
        over.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SettingsPatch' }
      responses:
        '200':
          description: The settings as they are now
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Settings' }
        '400': { $ref: '#/components/responses/Invalid' } # invalid_input (path: decider | decider_model | composer_model | escalate_below | min_confidence | retention_days | openai_base_url | ollama_url | keys.<name>), invalid_json
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/CsrfFailed' }
  /api/events:
    get:
      tags: [Live]
      operationId: streamEvents
      summary: Server-Sent Events stream of everything that changes
      description: |
        One long-lived `text/event-stream`. Each event has an `id` (counting up from 1 since
        the daemon started), an `event` name and a JSON `data` line:

        | event | data | when |
        | --- | --- | --- |
        | `message.processed` | `ActivityItem` | an email was decided, acted on or corrected |
        | `message.review` | `ActivityItem` | an email went to Needs review |
        | `action.undone` | `MessageAction` | one action was undone (a batch undo sends one per action) |
        | `account.status` | `Account` | an account's status changed, or it was edited |
        | `batch.progress` | `Batch` | a cleanup Sort moved forward or ended; `done`, `skipped`, `tokens` and `cost_usd` are its running totals |
        | `check.progress` | `CleanupCheck` | a cleanup check moved forward or ended; `done`, `total`, `model_calls` and `cost_usd` grow, then `status` is `ready`, `failed` or `stale`. Rows are not carried; GET the check for them |
        | `rules.changed` | `EventEmpty` | a rule was edited, deleted, reordered or imported: refetch the list |
        | `usage.updated` | `EventEmpty` | a model call was recorded: refetch stats |

        The daemon keeps the last 200 events. A client that reconnects sends the last id it saw
        in `Last-Event-ID` (EventSource does this by itself) and is first sent what it missed;
        an id from before a daemon restart replays everything kept. A new client (no header)
        is sent only what happens from then on. A client that falls 256 events behind is
        disconnected and catches up the same way. Lines starting with `:` are keep-alive comments.
      parameters:
        - name: Last-Event-ID
          in: header
          schema: { type: integer, format: int64 }
          description: Id of the last event the client saw
      responses:
        '200':
          description: The stream
          content:
            text/event-stream:
              schema: { type: string }
        '401': { $ref: '#/components/responses/Unauthenticated' }
  /healthz:
    get:
      tags: [Ops]
      operationId: healthz
      security: []
      summary: The process is up
      responses:
        '200':
          description: ok
          content:
            text/plain:
              schema: { type: string }
  /readyz:
    get:
      tags: [Ops]
      operationId: readyz
      security: []
      summary: The daemon can do its work (the database answers)
      responses:
        '200':
          description: ok
          content:
            text/plain:
              schema: { type: string }
        '503':
          description: The database is unavailable
          content:
            text/plain:
              schema: { type: string }
  /metrics:
    get:
      tags: [Ops]
      operationId: metrics
      security: []
      summary: Prometheus metrics
      description: Go runtime and process metrics, `mailrules_build_info`, `mailrules_http_requests_total{method,route,code}` and `mailrules_http_request_duration_seconds{method,route}`. Not behind the session; the daemon listens on 127.0.0.1 by default.
      responses:
        '200':
          description: Prometheus text format
          content:
            text/plain:
              schema: { type: string }
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: mailrules_session
      description: Set by `/api/auth/setup` and `/api/auth/login`. Non-GET requests also need the `X-CSRF-Token` header.
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64 }
    Cursor:
      name: cursor
      in: query
      schema: { type: string }
      description: The `next_cursor` of the previous page
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
    Since:
      name: since
      in: query
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
      description: Unix seconds; everything done at or after this time is undone
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorBody' }
    Invalid:
      description: The request is wrong; `code` says how and `path` names the field
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorBody' }
    Unauthenticated:
      description: No session. `setup_required` (show first-run setup) or `unauthenticated` (show sign-in)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorBody' }
    CsrfFailed:
      description: '`csrf_failed`: missing or wrong X-CSRF-Token header'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorBody' }
    NotFound:
      description: '`not_found`'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorBody' }
    Conflict:
      description: The request is valid but cannot be done in the current state; `code` says why
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorBody' }
    TooLarge:
      description: '`too_large`: the body is over 1 MB'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorBody' }
    ConnectionFailed:
      description: |
        The mail server could not be used with these details: `auth_failed` (path `password`),
        `tls_failed` (path `host`), `no_folder` (path `watch_folder`) or `connection_failed` (path `host`)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorBody' }
    Upstream:
      description: A mail server or model provider failed; `code` says which
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorBody' }
    Unprocessable:
      description: |
        The request is understood but cannot be carried out on this mail account.
        `no_special_folder`: the right rule archives, trashes or junks, and the account has no
        folder the server marks for that use (MailRules never guesses one). What had been done
        to the email before was already undone, and the correction itself was not recorded.
        The daemon sends the events for what it undid all the same: one `action.undone` per
        action, then `message.processed` with the row as it now is.
        `domain_too_broad` (path `always_for`): a sender rule for a whole free-mail domain
        would catch mail from strangers. Nothing was done; choose the address instead.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorBody' }
  schemas:
    Credentials:
      type: object
      required: [email, password]
      additionalProperties: false
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 12, description: Minimum applies to setup only }
    User:
      type: object
      required: [id, email]
      properties:
        id: { type: integer, format: int64 }
        email: { type: string }
    Session:
      type: object
      required: [user]
      properties:
        user: { $ref: '#/components/schemas/User' }
    ErrorBody:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: Stable machine-readable code, e.g. invalid_input, csrf_failed, unauthenticated
            message: { type: string, description: 'A sentence for a person, safe to show as it is: capitalised, ending with a full stop, with no field path in it. A refused import has one such line per rule, separated by newlines' }
            path: { type: string, description: 'Where the problem is, when there is a place: a field (`limit`), or a path into a rule (`rules[0].conditions.all[0].op`)' }

    Preset:
      type: object
      required: [name, label, host, port, tls_mode, help_url, local_part_login, secret_label]
      properties:
        name: { $ref: '#/components/schemas/PresetName' }
        label: { type: string, description: 'Shown in the provider picker, e.g. "iCloud Mail"' }
        host: { type: string, description: Empty for generic; the user supplies it }
        port: { type: integer }
        tls_mode: { $ref: '#/components/schemas/TLSMode' }
        help_url: { type: string, description: Where the user creates an app password; may be empty }
        local_part_login: { type: boolean, description: The server may want the part before "@" as the username; the daemon tries both }
        secret_label: { type: string, description: 'What the provider calls the secret the user pastes: "App-specific password" (iCloud), "App password" (Fastmail, Yahoo, Zoho) or "Password" (generic)' }
    PresetName: { type: string, enum: [icloud, fastmail, yahoo, zoho, generic] }
    TLSMode: { type: string, enum: [implicit, starttls] }
    AccountStatus:
      type: string
      enum: [new, live, reconnecting, auth_failed, error, paused]
      description: '`auth_failed` and `error` have stopped and wait for the user (fix the password, then reconnect); `paused` was set by the user'
    AccountInput:
      type: object
      required: [preset, username, password]
      additionalProperties: false
      properties:
        preset: { $ref: '#/components/schemas/PresetName' }
        username: { type: string }
        password: { type: string, writeOnly: true, description: The app password. Never returned }
        label: { type: string, description: Defaults to the username }
        host: { type: string, description: Required with the generic preset; otherwise overrides the preset }
        port: { type: integer, minimum: 1, maximum: 65535 }
        tls_mode: { $ref: '#/components/schemas/TLSMode' }
        watch_folder: { type: string, description: Left out = INBOX }
    AccountTestResult:
      type: object
      required: [username, folders, can_move, idle]
      properties:
        username: { type: string, description: The username that worked (may be the local part) }
        folders: { type: array, items: { $ref: '#/components/schemas/Folder' } }
        can_move: { type: boolean, description: False means rules can flag and mark mail here but not move it }
        idle: { type: boolean, description: False means new mail is checked for once a minute }
    Account:
      type: object
      required: [id, label, preset, host, port, tls_mode, username, watch_folder, status, last_error, last_event_at, last_mail_at, capabilities, can_move, folder_count, created_at]
      properties:
        id: { type: integer, format: int64 }
        label: { type: string }
        preset: { $ref: '#/components/schemas/PresetName' }
        host: { type: string }
        port: { type: integer }
        tls_mode: { $ref: '#/components/schemas/TLSMode' }
        username: { type: string }
        watch_folder: { type: string }
        status: { $ref: '#/components/schemas/AccountStatus' }
        last_error: { type: string, description: Why the status is what it is; empty when all is well }
        last_event_at: { type: [integer, 'null'], format: int64, description: 'When `status` last changed (the account went live, started reconnecting, failed, was paused). Not when mail last arrived: that is `last_mail_at`. null until the first status is reported' }
        last_mail_at: { type: [integer, 'null'], format: int64, description: 'When the newest email MailRules has seen in this account arrived (its received date); null when it has seen none' }
        capabilities: { type: array, items: { type: string }, description: What the server advertised at the last login }
        can_move: { type: boolean }
        folder_count: { type: integer }
        created_at: { type: integer, format: int64 }
    AccountEnvelope:
      type: object
      required: [account]
      properties:
        account: { $ref: '#/components/schemas/Account' }
    AccountPatch:
      type: object
      additionalProperties: false
      properties:
        label: { type: string }
        watch_folder: { type: string }
        password: { type: string, writeOnly: true, description: A new app password; reconnect follows }
        paused: { type: boolean, description: true stops watching; false resumes }
    Folder:
      type: object
      required: [name, delimiter, special_use]
      properties:
        name: { type: string, description: The server's own name, hierarchy delimiter included }
        delimiter: { type: string }
        special_use: { type: string, enum: ['', '\Junk', '\Trash', '\Archive', '\Sent', '\Drafts'] }

    Condition:
      type: object
      additionalProperties: false
      description: |
        One node of a condition tree: a group (`all` or `any` of its children) or a leaf
        (`field`, `op`, `value`). `{}` is the empty tree, which always matches. Fields:
        from, to, cc, delivered_to, from_domain, subject, body, list_id, attachment_ext,
        `header:<Name>` (strings); has_attachment, is_contact, replied_before, is_bulk,
        is_noreply (booleans); size_kb, age_days (numbers); dmarc (pass | fail | none);
        account (an account id).
      properties:
        all: { type: array, items: { $ref: '#/components/schemas/Condition' } }
        any: { type: array, items: { $ref: '#/components/schemas/Condition' } }
        field: { type: string }
        op: { type: string, enum: [eq, ne, in, contains, contains_any, not_contains, matches, gt, lt, exists] }
        value: { description: 'A string, number, boolean, or a list of them, as the operator needs. `matches` takes an RE2 pattern of at most 200 characters' }
    RuleAction:
      type: object
      required: [type]
      additionalProperties: false
      properties:
        type: { type: string, enum: [move, archive, trash, junk, flag, unflag, read, unread, keep] }
        folder: { type: string, description: 'For move only: 1 to 200 characters, no wildcards' }
    Rule:
      type: object
      required: [id, account_id, name, said, intent, conditions, exceptions, actions, priority, stack, model, min_confidence, enabled, version, created_at, updated_at, hits_week, last_match_at]
      properties:
        id: { type: integer, format: int64 }
        account_id: { type: [integer, 'null'], format: int64, description: null = every account }
        name: { type: string }
        said: { type: string, description: The user's original wording; may be empty }
        intent: { type: string, description: Plain-English intent for the decision model; empty = condition-only }
        conditions: { $ref: '#/components/schemas/Condition' }
        exceptions: { $ref: '#/components/schemas/Condition' }
        actions: { type: array, items: { $ref: '#/components/schemas/RuleAction' } }
        priority: { type: integer, description: Lower runs first }
        stack: { type: boolean, description: Also applies after another rule matched; condition-only }
        model: { type: string, description: 'Per-rule decider override: a decider name (jev, clef, anthropic) or name:model (clef:clef-flash, ollama:llama3.2; openai and ollama always need the model); empty = the default. An email is decided by the model of its highest-priority candidate rule that names one. A model that cannot be used (its key is not set) falls back to the default' }
        min_confidence: { type: [number, 'null'], minimum: 0, maximum: 1, description: null = the default threshold }
        enabled: { type: boolean }
        version: { type: integer, description: Goes up by one with every edit }
        created_at: { type: integer, format: int64 }
        updated_at: { type: integer, format: int64 }
        hits_week: { type: integer, description: Emails this rule was applied to in the last 7 days }
        last_match_at: { type: [integer, 'null'], format: int64 }
    RuleEnvelope:
      type: object
      required: [rule]
      properties:
        rule: { $ref: '#/components/schemas/Rule' }
    RuleList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Rule' } }
    ImportResult:
      type: object
      required: [items, created, updated]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Rule' } }
        created: { type: integer }
        updated: { type: integer }
    RulePatch:
      type: object
      additionalProperties: false
      description: |
        Validation: a name; conditions, an intent, or both; at least one action; an
        intent-based rule that trashes needs min_confidence of at least 0.85; a stacking rule
        is condition-only.
      properties:
        name: { type: string }
        said: { type: string }
        intent: { type: string }
        conditions: { $ref: '#/components/schemas/Condition' }
        exceptions: { $ref: '#/components/schemas/Condition' }
        actions: { type: array, items: { $ref: '#/components/schemas/RuleAction' } }
        account_id: { type: [integer, 'null'], format: int64 }
        stack: { type: boolean }
        model: { type: string }
        min_confidence: { type: [number, 'null'], minimum: 0, maximum: 1 }
        enabled: { type: boolean }
    RuleInput:
      type: object
      required: [name, actions]
      additionalProperties: false
      description: A rule as the client sends it when creating or testing one. The same validation as RulePatch.
      properties:
        name: { type: string }
        said: { type: string }
        intent: { type: [string, 'null'] }
        conditions: { $ref: '#/components/schemas/Condition' }
        exceptions: { $ref: '#/components/schemas/Condition' }
        actions: { type: array, items: { $ref: '#/components/schemas/RuleAction' } }
        account_id: { type: [integer, 'null'], format: int64 }
        stack: { type: boolean, description: Left out = false }
        model: { type: string }
        min_confidence: { type: [number, 'null'], minimum: 0, maximum: 1 }
        enabled: { type: boolean, description: 'Left out = true. A tested rule is always switched on' }
        new_folders: { type: array, items: { type: string }, description: Folders to create on the server when the rule is saved }
        position: { type: integer, minimum: 0, description: Where in the priority order to insert it (0 = first); left out = at the end }
    ComposeRequest:
      type: object
      required: [text]
      additionalProperties: false
      properties:
        text: { type: string, maxLength: 4000, description: Typed, or dictated and transcribed in the browser }
        account_id: { type: [integer, 'null'], format: int64, description: The account whose folders and recent mail the drafts are checked against }
    RuleDraft:
      type: object
      required: [name, said, intent, conditions, exceptions, actions, account_id, stack, model, min_confidence, new_folders, question, conflicts, errors, match_count, samples]
      description: 'A draft carries every field of RuleInput, so the approved card can be sent to `/api/rules/batch` (or, for a re-optimized rule, to PATCH) without losing anything'
      properties:
        name: { type: string }
        said: { type: string, description: The exact span of the user's words this rule came from }
        intent: { type: [string, 'null'] }
        conditions: { $ref: '#/components/schemas/Condition' }
        exceptions: { $ref: '#/components/schemas/Condition' }
        actions: { type: array, items: { $ref: '#/components/schemas/RuleAction' } }
        account_id: { type: [integer, 'null'], format: int64, description: 'null = every account, which is what a composed draft is for. A re-optimized rule keeps its own' }
        stack: { type: boolean, description: 'false for a composed draft; a re-optimized rule keeps its own' }
        model: { type: string, description: 'Empty for a composed draft; a re-optimized rule keeps its own' }
        min_confidence: { type: [number, 'null'] }
        new_folders: { type: array, items: { type: string }, description: Folders the rule names that do not exist yet }
        question: { type: [string, 'null'], description: At most one question, when the text was genuinely ambiguous }
        conflicts:
          type: array
          items:
            type: object
            required: [rule_id, kind, note]
            properties:
              rule_id: { type: integer, format: int64 }
              kind: { type: string, enum: [overlap, duplicate, shadowed] }
              note: { type: string }
        errors:
          type: array
          description: Validation problems of this draft; a draft with errors cannot be saved as it is
          items:
            type: object
            required: [path, message]
            properties:
              path: { type: string }
              message: { type: string }
        match_count: { type: integer, description: 'How many of the account''s last 200 emails it would take, the drafts being tested together in order. 0 for a draft with errors, for a draft with an intent while no decision model is set, and when no account is connected' }
        samples: { type: array, maxItems: 5, items: { $ref: '#/components/schemas/TestRow' } }
    ComposeResult:
      type: object
      required: [rules, unparsed]
      properties:
        rules: { type: array, items: { $ref: '#/components/schemas/RuleDraft' } }
        unparsed: { type: array, items: { type: string }, description: Parts of the text that could not be turned into a rule }
    RuleBatchRequest:
      type: object
      required: [rules]
      additionalProperties: false
      properties:
        rules: { type: array, minItems: 1, items: { $ref: '#/components/schemas/RuleInput' } }
    TestRequest:
      type: object
      required: [account_id]
      additionalProperties: false
      description: Give `rule_ids`, `rules` or both to test exactly those rules, or neither to test the saved rule set as it is.
      properties:
        account_id: { type: integer, format: int64 }
        rule_ids: { type: array, items: { type: integer, format: int64 }, description: 'Saved rules to test, each switched on, without the other saved rules and without the sender rules' }
        rules: { type: array, items: { $ref: '#/components/schemas/RuleInput' }, description: 'Draft rules to test, in the order given, after any saved rules named in `rule_ids`. The other saved rules take no part' }
        folder: { type: string, description: Left out = INBOX }
        limit: { type: integer, minimum: 1, maximum: 2000, description: 'Left out = 200. The most the daemon allows is 2000; more is refused with `invalid_input` at `limit`' }
    TestRow:
      type: object
      required: [from, subject, received_at, stage, rule_id, rule_name, confidence, reason, actions]
      properties:
        from: { type: string }
        subject: { type: string }
        received_at: { type: [integer, 'null'], format: int64 }
        stage: { $ref: '#/components/schemas/Stage' }
        rule_id: { type: [integer, 'null'], format: int64, description: null = no rule, or a draft (see rule_name) }
        rule_name: { type: string }
        confidence: { type: number }
        reason: { type: string }
        review: { type: boolean, description: Below the threshold; it would go to Needs review. Always present }
        actions: { type: array, items: { $ref: '#/components/schemas/RuleAction' }, description: What it would do }
    TestProgress:
      type: object
      required: [done, total, model_calls]
      properties:
        done: { type: integer, description: 'Emails tested so far, or passed over because they are gone or cannot be read' }
        total: { type: integer, description: 'Emails the run goes through; known once the mail is listed, so the first event is 0 of `total`' }
        model_calls: { type: integer, description: Model calls made so far }
    TestResult:
      type: object
      required: [results, tested, matched, model_calls, cost_usd]
      properties:
        results: { type: array, items: { $ref: '#/components/schemas/TestRow' } }
        tested: { type: integer, description: Emails read }
        matched: { type: integer, description: 'Of those, the emails one of the tested rules would be applied to. Only the rules this request tested count (`rule_ids` and `rules`, or the saved set when it names neither): a rule that was left out matches nothing here, and an email that would go to Needs review is not counted' }
        model_calls: { type: integer }
        cost_usd: { type: number }

    Sender:
      type: object
      required: [type, value, name, messages, last_seen_at, has_list_unsubscribe, verdict, rule_id, source, hits]
      properties:
        type: { type: string, enum: [address, domain] }
        value: { type: string, description: Lower-case address or domain }
        name: { type: string, description: 'The From display name of the newest email from this address. Empty when that email had none, for a domain, and for an address that has a sender rule but no mail in the last 30 days: show `value` once then, not twice' }
        messages: { type: integer, description: 'Emails MailRules has seen from this sender in the last 30 days; for a domain, from all its addresses' }
        last_seen_at: { type: [integer, 'null'], format: int64 }
        has_list_unsubscribe: { type: boolean, description: At least one of those emails carried a List-Unsubscribe header. Unsubscribing itself is not built (features.unsubscribe) }
        verdict: { type: [string, 'null'], enum: [route, keep, block, null], description: null = no sender rule; the rules decide }
        rule_id: { type: [integer, 'null'], format: int64, description: 'For route: the rule whose actions apply' }
        source: { type: [string, 'null'], enum: [user, learned, null] }
        hits: { type: integer, description: How often the sender rule has applied }
    SenderPut:
      type: object
      required: [verdict]
      additionalProperties: false
      properties:
        verdict: { type: string, enum: [route, keep, block] }
        rule_id: { type: integer, format: int64, description: Required for route; ignored otherwise }

    Stage:
      type: string
      enum: [sender, condition, decider, fallback, none]
      description: 'Which step settled an email: a sender rule, conditions alone, the decision model, the fallback model, or no rule. While no decision model is set, rules with an intent are passed over: a condition-only rule below them still applies (`condition`), and an email only they could take waits in Needs review with the reason "No decision model is set"'
    MessageState:
      type: string
      enum: [new, decided, acted, review, skipped, error]
      description: '`acted`: a rule was applied (or recorded, in dry-run). `review`: waiting in Needs review. `skipped`: no rule matched, or the email was gone. `error`: failed; it is retried. `new` and `decided` are in progress'
    ActionKind:
      type: string
      enum: [move, archive, trash, junk, flag, unflag, read, unread, keep, review]
      description: '`review` is the Needs review tag MailRules sets itself; no rule can name it'
    ActionStatus:
      type: string
      enum: [done, dry_run, failed, undone]
    Decision:
      type: object
      required: [id, stage, rule_id, rule_name, confidence, reason, model, tokens_in, tokens_out, cost_usd, latency_ms, created_at]
      properties:
        id: { type: integer, format: int64 }
        stage: { $ref: '#/components/schemas/Stage' }
        rule_id: { type: [integer, 'null'], format: int64, description: 'null = no rule, or the rule has since been deleted (then rule_name still names it). In Needs review: the rule the model suggested' }
        rule_name: { type: string, description: 'The rule''s current name, or the name it had when a deleted rule decided this. Empty when there is no rule' }
        confidence: { type: number }
        reason: { type: string, description: One sentence saying why }
        model: { type: string, description: The model whose answer was used; empty when none was asked }
        tokens_in: { type: integer }
        tokens_out: { type: integer }
        cost_usd: { type: number }
        latency_ms: { type: integer }
        created_at: { type: integer, format: int64 }
    MessageAction:
      type: object
      required: [id, message_id, account_id, decision_id, batch_id, kind, folder, from_folder, to_folder, status, error, created_at, undone_at]
      properties:
        id: { type: integer, format: int64 }
        message_id: { type: integer, format: int64 }
        account_id: { type: integer, format: int64 }
        decision_id: { type: [integer, 'null'], format: int64, description: null for a correction }
        batch_id: { type: [integer, 'null'], format: int64 }
        kind: { $ref: '#/components/schemas/ActionKind' }
        folder: { type: string, description: The destination a move names; empty otherwise }
        from_folder: { type: string, description: Where the email was just before this action }
        to_folder: { type: string, description: Where it was afterwards; empty unless the action was done }
        status: { $ref: '#/components/schemas/ActionStatus' }
        error: { type: string, description: Why it failed; empty otherwise }
        created_at: { type: integer, format: int64 }
        undone_at: { type: [integer, 'null'], format: int64 }
    ActivityItem:
      type: object
      required: [id, account_id, from, from_name, from_domain, subject, snippet, received_at, created_at, has_attachment, state, decision, actions, outcome, undoable, correction]
      description: One email in the feed. `id` is the message id used by `/api/messages/{id}` and the fix endpoints.
      properties:
        id: { type: integer, format: int64 }
        account_id: { type: integer, format: int64 }
        from: { type: string, description: The sender's address }
        from_name: { type: string, description: 'The sender''s display name from the From header; empty when the email had none (show the address)' }
        from_domain: { type: string }
        subject: { type: string }
        snippet: { type: string, maxLength: 200, description: The first characters of the text; blank once retention has purged it }
        received_at: { type: [integer, 'null'], format: int64 }
        created_at: { type: integer, format: int64, description: When MailRules first saw it }
        has_attachment: { type: boolean }
        state: { $ref: '#/components/schemas/MessageState' }
        decision:
          oneOf:
            - { $ref: '#/components/schemas/Decision' }
            - { type: 'null' }
          description: The latest decision; null until one is made
        actions: { type: array, items: { $ref: '#/components/schemas/MessageAction' }, description: Every action taken on it, oldest first }
        outcome: { type: string, description: 'What became of the email, as a sentence ready to show, from the actions of the latest decision or correction: "Moved to Food · read", "Kept in Inbox" (no rule matched), "In Inbox" (not decided yet, or waiting in Needs review), "Would move to Food" (recorded in dry-run), "Undone · back in Inbox", "Failed: no Archive folder"' }
        undoable: { type: boolean, description: At least one action is in effect and can be undone }
        correction:
          oneOf:
            - { $ref: '#/components/schemas/Correction' }
            - { type: 'null' }
          description: The user's latest word on this email, which overrules `decision`; null when it was never corrected
    Correction:
      type: object
      required: [kind, rule_id, rule_name, created_at]
      properties:
        kind: { type: string, enum: [correction, review], description: '`correction`: the user fixed what a rule had done, from the feed. `review`: the user answered an email waiting in Needs review' }
        rule_id: { type: [integer, 'null'], format: int64, description: The rule the user chose; null = keep in the inbox }
        rule_name: { type: string }
        created_at: { type: integer, format: int64 }
    ActivityPage:
      type: object
      required: [items, next_cursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/ActivityItem' } }
        next_cursor: { type: [string, 'null'] }
    ReviewPage:
      type: object
      required: [items, next_cursor, total]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/ActivityItem' } }
        next_cursor: { type: [string, 'null'] }
        total: { type: integer, description: The size of the whole queue, for the nav badge }
    Signals:
      type: object
      required: [bulk, noreply, is_contact, replied_before, dmarc]
      properties:
        bulk: { type: boolean }
        noreply: { type: boolean }
        is_contact: { type: boolean }
        replied_before: { type: boolean }
        dmarc: { type: string, description: 'pass, fail, none, or empty when unknown' }
    TraceStep:
      type: object
      required: [kind, label, detail, rule_id, rule_name, confidence, model, tokens_in, tokens_out, cost_usd, latency_ms, status, at, active, candidates]
      description: One line of the "Why this happened" panel, oldest first.
      properties:
        kind: { type: string, enum: [sender, condition, decider, fallback, none, action, correction], description: A decision stage, an action, or a correction by the user }
        label: { type: string, description: 'Short heading, e.g. "Decision model"' }
        detail: { type: string, description: 'The sentence to show: the reason, or what the action did' }
        rule_id: { type: [integer, 'null'], format: int64 }
        rule_name: { type: string }
        confidence: { type: [number, 'null'] }
        model: { type: string }
        tokens_in: { type: integer }
        tokens_out: { type: integer }
        cost_usd: { type: number }
        latency_ms: { type: integer }
        status: { type: string, enum: ['', done, dry_run, failed, undone], description: An action's status; empty for other kinds }
        at: { type: integer, format: int64 }
        active: { type: boolean, description: The step that settled where the email is now }
        candidates:
          type: array
          description: 'What the decision model (Jev, Clef) gave each rule it chose between, likeliest first. Empty when the model gives no such spread (a generative model), when none was asked, and for steps that are not a decision'
          items:
            type: object
            required: [rule_id, rule_name, probability]
            properties:
              rule_id: { type: [integer, 'null'], format: int64, description: null = none of the rules }
              rule_name: { type: string, description: The rule's name now; empty for none, and for a rule deleted since }
              probability: { type: number, minimum: 0, maximum: 1 }
    MessageDetail:
      allOf:
        - { $ref: '#/components/schemas/ActivityItem' }
        - type: object
          required: [to, list_id, size, signals, folder, current_folder, attempts, next_attempt_at, trace]
          properties:
            to: { type: array, items: { type: string } }
            list_id: { type: string }
            size: { type: integer, description: Bytes }
            signals: { $ref: '#/components/schemas/Signals' }
            folder: { type: string, description: Where it arrived }
            current_folder: { type: string, description: Where MailRules last left it }
            attempts: { type: integer, description: Retries made after a failure }
            next_attempt_at: { type: [integer, 'null'], format: int64 }
            trace: { type: array, items: { $ref: '#/components/schemas/TraceStep' } }
    FixRequest:
      type: object
      required: [rule_id]
      additionalProperties: false
      properties:
        rule_id: { type: [integer, 'null'], format: int64, description: The rule the email belongs to; null = keep it in the inbox }
        always_for_sender: { type: boolean, description: 'Left out = false. Also store a sender rule, so future mail from this address goes the same way. The same as `always_for: address`; `always_for` wins when both are sent' }
        always_for: { type: string, enum: [address, domain], description: 'Also store a sender rule, so future mail goes the same way: from this sender''s address, or from its whole domain (subdomains included). Left out = no sender rule. `domain` is refused with 422 `domain_too_broad` for a well-known free-mail domain' }
    FixResult:
      type: object
      required: [batch_id, item]
      properties:
        batch_id: { type: integer, format: int64, description: The correction batch holding the new actions }
        item: { $ref: '#/components/schemas/ActivityItem' }
    MessageUndoResult:
      type: object
      required: [batch_id, item, undone, failed]
      properties:
        batch_id: { type: integer, format: int64, description: The undo batch this call was recorded as }
        item: { $ref: '#/components/schemas/ActivityItem' }
        undone: { type: integer, description: Actions undone by this call }
        failed: { type: integer, description: 'Actions that could not be undone and are still in effect; `item.actions` says which' }
    Batch:
      type: object
      required: [id, kind, status, total, done, created_at, actions, account_id, folder, since, tokens, cost_usd, skipped, limit, matched]
      properties:
        id: { type: integer, format: int64 }
        kind: { type: string, enum: [live, cleanup, review, correction, undo], description: '`live` is one per UTC day of live processing, so "undo today" is one batch undo' }
        status: { type: string, enum: [running, done, failed, undone], description: 'A cleanup is `running` until it has been through its emails, then `done`; `failed` when it was cut short (what it did stays, and can be undone)' }
        total: { type: [integer, 'null'], description: 'How many items it set out to handle; null when not counted up front (live). For a cleanup, the emails selected' }
        done: { type: integer, description: 'How many it has handled; for an undo batch, how many actions were undone. For a cleanup Sort it includes the emails passed over (`skipped`), so the emails acted on are `done - skipped`' }
        created_at: { type: integer, format: int64 }
        account_id: { type: [integer, 'null'], format: int64, description: 'Cleanup: the mailbox it sorted. null for the other kinds, and once that account is deleted' }
        folder: { type: string, description: 'Cleanup: the folder it sorted. Empty for the other kinds' }
        since: { type: [integer, 'null'], format: int64, description: 'Cleanup: only mail received from this time on; null = all of it' }
        tokens: { type: integer, description: 'Cleanup: model tokens used so far, in and out. 0 for the other kinds' }
        cost_usd: { type: number, description: 'Cleanup: model cost so far. 0 for the other kinds' }
        limit: { type: [integer, 'null'], description: 'Cleanup: the most emails its check was allowed to cover (the newest of its range). null for the other kinds, and for a cleanup made before this was recorded' }
        matched: { type: [integer, 'null'], description: 'Cleanup: how many emails the folder held in the range before `limit` cut it. With `since`, `limit` and this the batch can say what it covered: more than `limit` means the check took only the newest `limit`. null when `limit` is' }
        skipped: { type: integer, description: 'Cleanup Sort: selected emails passed over because they were no longer where the check found them. 0 for the other kinds' }
        actions:
          type: object
          description: How many of the batch's own actions have each status. An undo batch has none of its own
          required: [done, dry_run, failed, undone]
          properties:
            done: { type: integer }
            dry_run: { type: integer }
            failed: { type: integer }
            undone: { type: integer }
    UndoResult:
      type: object
      required: [batch, undone, failed]
      properties:
        batch: { $ref: '#/components/schemas/Batch' }
        undone: { type: integer, description: Actions undone by this call }
        failed: { type: integer, description: 'Actions that could not be undone: the email is gone, or its account is not connected' }

    CleanupCheckRequest:
      type: object
      required: [account_id]
      additionalProperties: false
      properties:
        account_id: { type: integer, format: int64 }
        folder: { type: string, description: 'One folder of the account; left out = INBOX. There is no "all folders"' }
        since: { type: [integer, 'null'], format: int64, description: Only mail received on or after this time's date; null = all of it }
        limit: { type: integer, minimum: 1, maximum: 2000, description: 'Only the newest N emails of the range. Left out = 2000, the most a check covers: when the range holds more, `CleanupCheck.matched` says how many, and a further check covers the rest' }
    CleanupSelectionRequest:
      type: object
      required: [account_id, check_id, exclude]
      additionalProperties: false
      properties:
        account_id: { type: integer, format: int64 }
        check_id: { type: string, description: The check the ticks belong to; it must still be the account's current one }
        exclude: { type: array, items: { type: integer }, description: 'Row indices (CleanupCheckRow.index) of selectable rows that are not ticked; empty = all ticked' }
    CleanupRunRequest:
      type: object
      required: [account_id, check_id]
      additionalProperties: false
      properties:
        account_id: { type: integer, format: int64 }
        check_id: { type: string, description: The check to sort; it must still be the account's current one }
        exclude: { type: array, items: { type: integer }, description: 'Row indices (CleanupCheckRow.index) of selectable rows the user unticked; omitted or empty sorts every selectable row' }
    CleanupCheck:
      type: object
      description: One real check of a mailbox, held in the daemon's memory until Sort uses it or it is discarded
      required: [id, account_id, folder, since, limit, status, done, total, matched, model_calls, tokens, cost_usd, error, rows, exclude]
      properties:
        id: { type: string, description: Changes with every new check of the account }
        account_id: { type: integer, format: int64 }
        folder: { type: string, description: The folder checked, for restoring the screen's scope }
        since: { type: [integer, 'null'], format: int64, description: 'Only mail from this time on; null = all of it' }
        limit: { type: integer, description: 'The most emails the check covers, the newest of its range (2000 when the request left it out)' }
        status: { type: string, enum: [running, ready, failed, stale], description: '`running`: the check is still going (`done`/`total`). `ready`: through, `rows` present. `failed`: `error` says why. `stale`: the rules changed since; Sort is refused until a new check' }
        done: { type: integer, description: Emails checked so far }
        total: { type: integer, description: 'Emails the check will go through, known once the mail is listed: at most `limit`' }
        matched: { type: integer, description: 'Emails the folder holds in the chosen range before `limit` was applied, known once the mail is listed (0 until then). More than `total` when the range holds more than the check covers: the check took the newest `total` of them' }
        model_calls: { type: integer, description: Model calls made so far }
        tokens: { type: integer, description: Model tokens so far, in and out }
        cost_usd: { type: number, description: Real model cost so far }
        error: { type: string, description: Why the check failed; empty otherwise }
        rows: { type: array, items: { $ref: '#/components/schemas/CleanupCheckRow' }, description: 'One per checked email, newest first; present when ready or stale, empty otherwise' }
        exclude: { type: array, items: { type: integer }, description: 'The saved selection (PUT /api/cleanup/check/selection): indices of selectable rows that are not ticked, ascending; empty = all ticked. Present with the rows, empty otherwise' }
    CleanupCheckRow:
      type: object
      description: One checked email and how the real flow settled it
      required: [index, from, subject, received_at, folder, uid, uidvalidity, stage, rule_id, rule_name, actions, confidence, selectable, review, reason]
      properties:
        index: { type: integer, description: 'Its position in rows; name it in CleanupRunRequest.exclude to untick it' }
        from: { type: string }
        subject: { type: string }
        received_at: { type: [integer, 'null'], format: int64 }
        folder: { type: string, description: Where the email was when checked }
        uid: { type: integer, format: int64 }
        uidvalidity: { type: integer, format: int64 }
        stage: { $ref: '#/components/schemas/Stage' }
        rule_id: { type: [integer, 'null'], format: int64, description: 'The rule that took it; null for a sender keep/block, Needs review and left-alone rows' }
        rule_name: { type: string, description: 'The rule''s name; "Sender rule: keep" or "Sender rule: trash" for a sender rule without a rule; empty where nothing took it' }
        actions: { type: array, items: { $ref: '#/components/schemas/RuleAction' }, description: What would be done; empty for review and left-alone rows }
        confidence: { type: [number, 'null'], description: 'How sure the model was, 0..1; null where no model was asked. Meaningful only where a rule took the email or it is `review`; for a left-alone row the model answered "no rule" and it is 0' }
        selectable: { type: boolean, description: 'Whether the row can be ticked for Sort: a rule settled it with an action and it would not wait in Needs review. Ticked by default' }
        review: { type: boolean, description: 'The email would wait in Needs review: below the act-when-sure threshold, or no decision model is set. Not selectable' }
        reason: { type: string, description: One sentence saying how it was settled, or why it cannot be ticked }
    Template:
      type: object
      required: [id, name, description, rule]
      description: 'The gallery holds eight: newsletters, receipts, login codes, cold sales, travel, social notifications, bank statements, calendar invites'
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        rule: { $ref: '#/components/schemas/RuleInput' }

    ModelUsage:
      type: object
      required: [provider, model, purpose, calls, tokens_in, tokens_out, cost_usd]
      properties:
        provider: { type: string }
        model: { type: string }
        purpose: { type: string, enum: [decide, escalate, compose, test, cleanup] }
        calls: { type: integer }
        tokens_in: { type: integer }
        tokens_out: { type: integer }
        cost_usd: { type: number }
    StatsSummary:
      type: object
      required: [range, since, counts, went, decided_without_model, cost_usd, calls_by_model, top_rules, quiet_rules, accounts]
      properties:
        range: { type: string, enum: [day, week, month] }
        since: { type: integer, format: int64, description: Start of the range }
        counts:
          type: object
          required: [processed, sorted, trashed, review]
          properties:
            processed: { type: integer, description: Emails decided in the range }
            sorted: { type: integer, description: 'Of those, a rule or sender rule was applied (or recorded, in dry-run) and at least one of its actions is still in effect. An email whose actions were all undone is not counted' }
            trashed: { type: integer, description: 'Emails with a trash action from the range that is in effect (or recorded, in dry-run)' }
            review: { type: integer, description: Waiting in Needs review now }
        went:
          type: object
          description: Where the processed emails ended up, for the Overview bar. The four add up to `counts.processed`
          required: [sorted, inbox, review, trashed]
          properties:
            sorted: { type: integer, description: 'A rule was applied, is still in effect (not undone) and did not trash the email' }
            inbox: { type: integer, description: 'Left in the inbox: no rule matched, the email could not be handled, or everything done to it was undone' }
            review: { type: integer, description: 'Of the processed emails, those waiting in Needs review' }
            trashed: { type: integer, description: 'A rule was applied and it trashed the email, and that is still in effect (not undone)' }
        quiet_rules: { type: integer, description: Enabled rules applied to no email in the range }
        decided_without_model: { type: number, minimum: 0, maximum: 1, description: 'Share of the processed emails a sender rule or a condition rule acted on, with no model asked. An email waiting in Needs review, one no rule matched, and one a model decided do not count, but all stay in the base. 0 when nothing was processed' }
        cost_usd: { type: number }
        calls_by_model: { type: array, items: { $ref: '#/components/schemas/ModelUsage' }, description: 'One row per provider, model and purpose, dearest first: a model used both to decide and as the fallback has two rows. Add them up for a per-model figure' }
        top_rules:
          type: array
          description: The five rules applied to the most emails, most first
          items:
            type: object
            required: [rule_id, rule_name, hits]
            properties:
              rule_id: { type: [integer, 'null'], format: int64 }
              rule_name: { type: string }
              hits: { type: integer }
        accounts:
          type: array
          items:
            type: object
            required: [account_id, label, preset, username, folder_count, status, last_event_at, last_error]
            properties:
              account_id: { type: integer, format: int64 }
              label: { type: string }
              preset: { type: string, description: 'icloud | fastmail | yahoo | zoho | generic' }
              username: { type: string }
              folder_count: { type: integer }
              status: { $ref: '#/components/schemas/AccountStatus' }
              last_event_at: { type: [integer, 'null'], format: int64 }
              last_error: { type: string }
    StatsUsage:
      type: object
      required: [range, since, processed, emails, calls, cost_usd, days, by_rule, by_model, without_model]
      properties:
        range: { type: string, enum: [month] }
        since: { type: integer, format: int64 }
        processed: { type: integer, description: 'Emails decided in the range, whatever came of them. The base of `without_model`' }
        emails: { type: integer, description: 'Of the processed emails, those a rule or sender rule was applied to and not undone since (sorted)' }
        calls: { type: integer }
        cost_usd: { type: number }
        days:
          type: array
          description: 'One entry per UTC day of the range, oldest first, the days without a call too (their `models` is empty)' 
          items:
            type: object
            required: [day, models]
            properties:
              day: { type: string, format: date }
              models:
                type: array
                items:
                  type: object
                  required: [provider, model, purpose, calls, cost_usd]
                  description: One entry per provider, model and purpose
                  properties:
                    provider: { type: string }
                    model: { type: string }
                    purpose: { type: string, enum: [decide, escalate, compose, test, cleanup] }
                    calls: { type: integer }
                    cost_usd: { type: number }
        by_rule:
          type: array
          items:
            type: object
            required: [rule_id, rule_name, emails, calls, cost_usd]
            properties:
              rule_id: { type: [integer, 'null'], format: int64, description: 'null with an empty `rule_name` is the row for emails no rule was applied to (show "No rule"); null with a name is a rule deleted since' }
              rule_name: { type: string, description: Empty for the no-rule row }
              emails: { type: integer }
              calls: { type: integer, description: Decisions a model was asked for }
              cost_usd: { type: number }
        by_model: { type: array, items: { $ref: '#/components/schemas/ModelUsage' }, description: 'One row per provider, model and purpose, dearest first' }
        without_model: { type: integer, description: 'Of the `processed` emails, those a sender rule or a condition rule acted on, with no model asked (not the ones waiting in Needs review, nor those no rule matched). Never more than `processed`; the free share is `without_model / processed`, not over `emails`' }

    Decider: { type: string, enum: [jev, clef, anthropic, openai, ollama] }
    KeySource:
      type: string
      enum: [stored, environment, none]
      description: 'Where a provider key in force comes from. `stored`: saved through this API (it wins over the environment, and can be removed here). `environment`: set in the daemon''s environment only (it cannot be removed here). `none`: not set'
    ProviderKeys:
      type: object
      description: 'For each provider key, where the one in force comes from. Never the key'
      required: [openrouter_api_key, cloudflare_account_id, cloudflare_api_token, anthropic_api_key, openai_api_key]
      properties:
        openrouter_api_key: { $ref: '#/components/schemas/KeySource', description: Jev }
        cloudflare_account_id: { $ref: '#/components/schemas/KeySource', description: Clef }
        cloudflare_api_token: { $ref: '#/components/schemas/KeySource', description: Clef }
        anthropic_api_key: { $ref: '#/components/schemas/KeySource', description: The Haiku fallback and the rule composer }
        openai_api_key: { $ref: '#/components/schemas/KeySource', description: An OpenAI-compatible endpoint }
    SettingsWarning:
      type: object
      required: [code, message, path]
      description: Something about the settings in force that will not work as it stands. Shaped like an error, but the settings were saved.
      properties:
        code: { type: string, enum: [decider_not_ready], description: '`decider_not_ready`: the chosen decider lacks a key or its URL' }
        message: { type: string, description: A sentence for a person }
        path: { type: string, description: 'The setting to fill in, as SettingsPatch spells it: `ollama_url`, `keys.openrouter_api_key`' }
    Settings:
      type: object
      required: [dry_run, decider, decider_model, fallback_model, composer_model, escalate_below, min_confidence, retention_days, openai_base_url, ollama_url, keys, warnings, server, features]
      properties:
        dry_run: { type: boolean, description: While true, decisions are logged and no mailbox is changed }
        decider: { $ref: '#/components/schemas/Decider' }
        decider_model: { type: string, description: 'Empty = the provider''s default; openai and ollama have none' }
        fallback_model: { type: string, description: Asked when the decider is unsure; empty = off }
        composer_model: { type: string }
        escalate_below: { type: number, minimum: 0, maximum: 1, description: Decider confidence below this asks the fallback }
        min_confidence: { type: number, minimum: 0, maximum: 1, description: Default act threshold; a rule may set its own }
        retention_days: { type: integer, minimum: 1, maximum: 3650, description: How long message snippets are kept }
        openai_base_url: { type: string, description: 'The OpenAI-compatible endpoint the openai decider talks to; empty = api.openai.com. Not a secret' }
        ollama_url: { type: string, description: 'The Ollama server the ollama decider talks to, e.g. http://localhost:11434; empty = not set. Not a secret' }
        keys: { $ref: '#/components/schemas/ProviderKeys' }
        warnings: { type: array, items: { $ref: '#/components/schemas/SettingsWarning' }, description: 'What the chosen decider still lacks; empty when it can run. For example decider `ollama` with no `ollama_url`' }
        server:
          type: object
          readOnly: true
          required: [version, data_dir, listen, mode]
          properties:
            version: { type: string }
            data_dir: { type: string }
            listen: { type: string }
            mode: { type: string, enum: [selfhost, cloud] }
        features:
          type: object
          readOnly: true
          description: Later-phase features the UI draws; each stays hidden until its flag is true
          required: [digest, notifications, timed_actions, draft_replies, billing, unsubscribe, oauth_providers]
          properties:
            digest: { type: boolean }
            notifications: { type: boolean }
            timed_actions: { type: boolean }
            draft_replies: { type: boolean }
            billing: { type: boolean }
            unsubscribe: { type: boolean }
            oauth_providers: { type: boolean }
    SettingsPatch:
      type: object
      additionalProperties: false
      description: 'For every field: left out = unchanged; `null` = forget the stored value, so the environment''s default is back in force; an empty string = that value, stored (see each field), or refused where empty cannot work'
      properties:
        dry_run: { type: [boolean, 'null'] }
        decider:
          oneOf:
            - { $ref: '#/components/schemas/Decider' }
            - { type: 'null' }
        decider_model: { type: [string, 'null'], description: 'Empty = the provider''s default model; refused while the decider is openai or ollama, which have none' }
        fallback_model: { type: [string, 'null'], description: Empty = off; the fallback is never asked }
        composer_model: { type: [string, 'null'], description: Empty is refused; the composer needs a model }
        escalate_below: { type: [number, 'null'], minimum: 0, maximum: 1 }
        min_confidence: { type: [number, 'null'], minimum: 0, maximum: 1 }
        retention_days: { type: [integer, 'null'], minimum: 1, maximum: 3650 }
        openai_base_url: { type: [string, 'null'], description: An http or https URL. Empty = api.openai.com }
        ollama_url: { type: [string, 'null'], description: 'An http or https URL. Empty = no server, so the ollama decider cannot run (a warning says so)' }
        keys:
          type: object
          writeOnly: true
          additionalProperties: false
          description: 'Provider keys to store. A key cannot be set to nothing: an empty string and `null` both remove the stored key, which puts the environment''s back in force'
          properties:
            openrouter_api_key: { type: [string, 'null'] }
            cloudflare_account_id: { type: [string, 'null'] }
            cloudflare_api_token: { type: [string, 'null'] }
            anthropic_api_key: { type: [string, 'null'] }
            openai_api_key: { type: [string, 'null'] }

    EventMessageProcessed:
      description: Data of `message.processed`
      allOf: [{ $ref: '#/components/schemas/ActivityItem' }]
    EventMessageReview:
      description: Data of `message.review`
      allOf: [{ $ref: '#/components/schemas/ActivityItem' }]
    EventActionUndone:
      description: Data of `action.undone`
      allOf: [{ $ref: '#/components/schemas/MessageAction' }]
    EventAccountStatus:
      description: Data of `account.status`
      allOf: [{ $ref: '#/components/schemas/Account' }]
    EventBatchProgress:
      description: Data of `batch.progress`
      allOf: [{ $ref: '#/components/schemas/Batch' }]
    EventEmpty:
      description: Data of `rules.changed` and `usage.updated`; refetch
      type: object
      additionalProperties: false
